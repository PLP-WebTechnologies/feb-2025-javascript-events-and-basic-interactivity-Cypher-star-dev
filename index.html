<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Simple Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Welcome to My Page</h1>

<button id="btn">Click Me!</button>
<p id="secret" class="secret">Secret Action Triggered!</p>

<p>Type something here:</p>
<input id="inputKey" type="text" placeholder="Type...">
<p id="keyResult"></p>

<h2>Gallery</h2>
<div id="gallery">
  <img src="https://picsum.photos/id/1015/200/140" alt="Pic1">
  <img src="https://picsum.photos/id/1025/200/140" alt="Pic2">
  <img src="https://picsum.photos/id/1035/200/140" alt="Pic3">
</div>
<img id="mainPic" src="https://picsum.photos/id/1015/400/280" alt="Main Pic">

<h2>Tabs</h2>
<div id="tabButtons">
  <button class="tab active" data-num="1">Tab One</button>
  <button class="tab" data-num="2">Tab Two</button>
  <button class="tab" data-num="3">Tab Three</button>
</div>
<div id="tabContent">This is Tab One content.</div>

<h2>Form</h2>
<form id="form" novalidate>
  Name:<br>
  <input type="text" id="name" required>
  <span id="nameErr" class="errorMsg"></span><br><br>

  Email:<br>
  <input type="email" id="email" required>
  <span id="emailErr" class="errorMsg"></span><br><br>

  Password:<br>
  <input type="password" id="password" required>
  <span id="passErr" class="errorMsg"></span><br><br>

  <button type="submit">Submit</button>
</form>

<script src="script.js"></script>
</body>
</html>
